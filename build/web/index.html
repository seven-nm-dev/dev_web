<!DOCTYPE html>
<html lang="ru">

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Заголовок и Описание -->
  <title>NM DEV — Разработка мобильных приложений, сайтов и ботов</title>
  <meta name="title" content="NM DEV — Разработка мобильных приложений, сайтов и ботов">
  <meta name="description"
    content="Разрабатываем быстрые мобильные приложения на Flutter для iOS и Android, веб-сайты и Telegram-боты. Качественные IT-решения под ключ.">
  <meta name="keywords"
    content="разработка приложений, Flutter, заказать сайт, Telegram боты, мобильные приложения, NM DEV">

  <!-- Open Graph / Соцсети -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="NM DEV — Студия разработки приложений и сайтов">
  <meta property="og:description" content="Создаем IT-продукты на Flutter: мобильные приложения, сайты и боты.">
  <meta property="og:image" content="assets/assets/images/logo.png">

  <!-- Иконки -->
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="manifest" href="manifest.json">

  <!-- Жесткое скрытие любых плашек, дрейверов и оверлеев Netlify -->
  <style>
    [data-netlify-drawer],
    [id*="netlify"],
    [class*="netlify"],
    iframe[src*="netlify"],
    net-lify-drawer,
    netlify-drawer,
    #netlify-identity-widget {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      height: 0 !important;
      width: 0 !important;
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
    }
  </style>

  <!-- Скрипт-блокиратор встраивания элементов Netlify -->
  <script>
    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.nodeType === 1) {
            const tagName = node.tagName.toLowerCase();
            const id = node.id || '';
            const className = typeof node.className === 'string' ? node.className : '';
            if (
              tagName.includes('netlify') ||
              id.includes('netlify') ||
              className.includes('netlify') ||
              node.hasAttribute('data-netlify-drawer')
            ) {
              node.remove();
            }
          }
        }
      }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  </script>
</head>

<body style="background-color: #0D0D11;" data-netlify-header="false">
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
